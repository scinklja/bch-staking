name: Publish GitHub Pages frontend (manual only)
on:
  workflow_dispatch:
    inputs:
      source:
        description: Read-only data source (browser Electrum needs no API)
        type: choice
        default: electrum
        options: [electrum, api]
      electrum_endpoints:
        description: Public chipnet WSS endpoints, comma separated
        default: wss://chipnet.bch.ninja:50004,wss://chipnet.imaginary.cash:50004
        required: false
      api_url:
        description: Verified independent HTTPS chipnet API URL (API mode only)
        required: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate live API
        if: ${{ inputs.source == 'api' }}
        env:
          API_URL: ${{ inputs.api_url }}
        run: |
          node --input-type=module <<'JS'
          const url=new URL(process.env.API_URL);
          if(url.protocol!=='https:'||url.username||url.password)throw Error('HTTPS public API required');
          const response=await fetch(url.href.replace(/\/$/,'')+'/health');
          const body=await response.json();
          if(!response.ok||body.chain!=='chipnet'||!body.health.connected||!body.tip||Date.now()-Date.parse(body.health.updatedAt)>30000)throw Error('Independent chipnet API must be healthy before publication');
          JS
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
        env:
          VITE_INDEXER_MODE: ${{ inputs.source || 'electrum' }}
          VITE_ELECTRUM_ENDPOINTS: ${{ inputs.electrum_endpoints || 'wss://chipnet.bch.ninja:50004,wss://chipnet.imaginary.cash:50004' }}
          VITE_API_BASE_URL: ${{ inputs.api_url }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - id: deploy
        uses: actions/deploy-pages@v4
