services:
  arena:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    init: true
    network_mode: host
    environment:
      ARENA_NETWORK: chipnet
      ARENA_HOSTED: '1'
      ARENA_BIND: 127.0.0.1
      ARENA_DATA_DIR: /data/arena
      ARENA_UI_ORIGIN: https://scinklja.github.io
      BCH_RPC_COOKIE: /rpc/.cookie
      BCH_RPC_URL: http://127.0.0.1:48332
    volumes:
      - ./data:/data/arena
      - ${BCHN_CHIPNET_DIR:?set BCHN_CHIPNET_DIR}:/rpc:ro
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  https:
    image: caddy:2
    restart: unless-stopped
    network_mode: host
    environment:
      ARENA_API_DOMAIN: ${ARENA_API_DOMAIN:?set ARENA_API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  caddy-data:
  caddy-config:
